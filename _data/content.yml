about:
  eyebrow:
    ar: من نحن
    en: About us
  title:
    ar: توأمٌ من أبها، وحلمٌ واحد يزهر
    en: Twins from Abha, one blooming dream
  text:
    ar: 'بدأ عادل وعبدالله في 2020 من حساب صغير يوصّلان منه الورد بأيديهما. واليوم صار ساق الجوري محلاً في حي المنسك، ومزرعة يكبر فيها دوار الشمس، ومصنع خشبيات متكاملاً. لسنا وسيطاً: نتحكم في الجودة والمواعيد والتخصيص من البذرة حتى التسليم.'
    en: 'Adel and Abdullah started in 2020 with a small account, delivering flowers by hand. Today SAQ ALJORI is a shop in Al-Manssak, a farm where our sunflowers grow, and a full woodwork workshop. We are not a reseller: we control quality, timing and customization from seed to delivery.'
  pillars:
  - title:
      ar: من مزرعتنا
      en: From our farm
    text:
      ar: ورد نزرعه ونقطفه بأيدينا.
      en: Flowers we grow and pick by hand.
    image: ''
  - title:
      ar: من مصنعنا
      en: From our workshop
    text:
      ar: صناديق ولوحات وستاندات بشعاركم.
      en: Boxes, signs and stands with your logo.
    image: ''
  - title:
      ar: من محلنا في المنسك
      en: From our Abha shop
    text:
      ar: تنسيق يومي وتوصيل في الموعد.
      en: Daily arranging and on-time delivery.
    image: ''
